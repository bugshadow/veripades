# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  db:
    image: postgres:15-alpine
    container_name: poc-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  crypto:
    build:
      context: ./crypto_service
    container_name: poc-crypto
    environment:
      PKI_PASSPHRASE: ${PKI_PASSPHRASE}
    ports:
      - "8000:8000"
    volumes:
      - ./crypto_service:/app
      - pdf_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: poc-api
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      CRYPTO_SERVICE_URL: ${CRYPTO_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      PDF_STORAGE_DIR: ${PDF_STORAGE_DIR}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - pdf_storage:/app/storage
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      crypto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/documents || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: poc-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  pdf_storage:


